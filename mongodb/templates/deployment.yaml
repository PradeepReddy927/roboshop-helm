apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: roboshop
  # Thses are replica set labels
  labels:
    project: roboshop
    component: mongodb
    tier: db
spec: 
  replicas: 1
  selector:
    # These labels are used to select pods
    matchLabels:
       project: roboshop
       component: mongodb
       tier: db
  # Pod definition    
  template:
    metadata:
      labels:
        project: roboshop
        component: mongodb
        tier: db
    spec: 
      containers: 
      - name: mongodb
        image: "{{ .Values.deployment.imagesRepo }}:{{ .Values.deployment.imageVersion }}"
        imagePullPolicy: Always 
        readinessProbe:
          tcpSocket:
            port: 27017
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 10
            periodSeconds: 5
---